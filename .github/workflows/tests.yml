name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 13 requires PHP 8.3, which is its own floor rather than
          # this package's. A PHP 8.2 user resolves to Laravel 12, so the
          # combination below cannot exist to be tested.
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, intl, bcmath, pdo_sqlite
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}"
          composer require --dev --no-interaction --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  currency:
    name: Zero-decimal currency guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, intl, bcmath
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress

      # The defect this package exists to prevent gets its own job, so a
      # regression here is impossible to miss in a matrix of green checks.
      - name: 10 000 XOF must leave as 10000
        run: |
          vendor/bin/phpunit --filter 'ten_thousand_xof_is_sent_as_ten_thousand|it_sends_the_amount_in_whole_francs|a_fractional_amount_in_a_zero_decimal_currency_is_refused'
